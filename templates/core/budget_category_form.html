{% extends 'core/base.html' %}
{% block page_title %}{{ action }} Budget Category{% endblock %}
{% block content %}
<style>
    body {
        background: linear-gradient(135deg, #f0fdfa 0%, #e6fffa 100%);
        min-height: 100vh;
    }
    .page-header {
        background: linear-gradient(135deg, #14b8a6 0%, #0d9488 50%, #0f766e 100%);
        border-radius: 20px;
        padding: 30px;
        color: #fff;
        margin-bottom: 30px;
        box-shadow: 0 10px 40px rgba(20, 184, 166, 0.3);
    }
    .form-card {
        background: #fff;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 10px 50px rgba(0, 0, 0, 0.1);
        border: 2px solid #e6fffa;
    }
    .form-label {
        font-weight: 600;
        color: #334155;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
    }
    .form-label i {
        margin-right: 8px;
        color: #14b8a6;
    }
    .form-control {
        border-radius: 12px;
        border: 2px solid #e2e8f0;
        padding: 14px 20px;
        transition: all 0.3s ease;
    }
    .form-control:focus {
        border-color: #14b8a6;
        box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.1);
        outline: none;
    }
    .btn-submit {
        background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
        color: #fff;
        border-radius: 50px;
        padding: 15px 60px;
        font-weight: 700;
        border: none;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(20, 184, 166, 0.3);
    }
    .btn-submit:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(20, 184, 166, 0.4);
        color: #fff;
    }
    .btn-cancel {
        background: #64748b;
        color: #fff;
        border-radius: 50px;
        padding: 15px 50px;
        font-weight: 600;
        border: none;
        transition: all 0.3s ease;
    }
    .btn-cancel:hover {
        background: #475569;
        color: #fff;
    }
</style>

<div class="container-fluid py-4">
    <div class="page-header">
        <h2><i class="fas fa-tags me-2"></i>{{ action }} Budget Category</h2>
    </div>
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="form-card">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label" for="{{ form.name.id_for_label }}">
                            <i class="fas fa-tag"></i>Category Name <span class="text-danger">*</span>
                        </label>
                        {{ form.name }}
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="{{ form.description.id_for_label }}">
                            <i class="fas fa-align-left"></i>Description
                        </label>
                        {{ form.description }}
                    </div>
                    <div class="text-center mt-5">
                        <button type="submit" class="btn btn-submit me-3">
                            <i class="fas fa-save me-2"></i>{{ action }}
                        </button>
                        <a href="{% url 'budget_category_list' %}" class="btn btn-cancel">
                            <i class="fas fa-times me-2"></i>Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
