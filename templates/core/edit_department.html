{% extends 'core/base.html' %}
{% load static %}

{% block title %}Edit Department - HRM System{% endblock %}

{% block page_title %}
<div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
    <div class="flex-grow-1">
        <h1 class="h3 mb-1 fw-bold">
            <i class="fas fa-building me-2"></i>Edit Department: {{ department.name }}
        </h1>
        <p class="text-muted mb-0 small">Update department information</p>
    </div>
    <div class="d-flex flex-wrap gap-2 align-items-center">
        <a href="{% url 'manage_departments' %}" class="btn btn-sm btn-light">
            <i class="fas fa-arrow-left me-1"></i>Back to Departments
        </a>
    </div>
</div>
{% endblock %}

{% block content %}
<style>
    .form-card {
        border: none;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        padding: 2rem;
        background: white;
    }
    .form-label {
        font-weight: 600;
        color: #2d3748;
        margin-bottom: 0.5rem;
    }
    .form-control {
        border-radius: 10px;
        border: 2px solid #e9ecef;
        padding: 0.75rem;
        transition: all 0.3s;
    }
    .form-control:focus {
        border-color: #0e7490;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
</style>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="form-card">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_name" class="form-label">Department Name</label>
                    <input type="text" class="form-control" id="id_name" name="name" value="{{ form.name.value|default:department.name }}" required>
                </div>
                <div class="mb-3">
                    <label for="id_description" class="form-label">Description</label>
                    <textarea class="form-control" id="id_description" name="description" rows="4" placeholder="Enter department description (optional)">{{ form.description.value|default:department.description }}</textarea>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                    <a href="{% url 'manage_departments' %}" class="btn btn-light">
                        <i class="fas fa-times me-2"></i>Cancel
                    </a>
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fas fa-save me-2"></i>Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
